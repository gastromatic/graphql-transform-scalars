fragment Blog on BlogArticle {
  title
  blogDate: publishedDate
}

fragment AuthorBooks on Author {
  id
  books {
    id
    bookTitle: title
  }
  writtenWorks {
    __typename
    id
    ...Blog
  }
}

query GetAuthorsWithBooks {
  authors {
    id
    ...AuthorBooks
  }
}

query GetAuthors {
  authors {
    id
    dateOfBirth
    books {
      id
      title
      published
    }
  }
}

query GetAuthorsWithWrittenWorks {
  authors {
    id
    authorDateOfBirth: dateOfBirth
    writtenWorks {
      __typename
      id
      ... on Book {
        published
        bookTitle: title
      }
      ... on BlogArticle {
        publishedDate
        blogTitle: title
      }
    }
  }
}
